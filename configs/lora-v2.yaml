# Second training pass, aiming at accuracy rather than speed.
#
# Three changes from configs/lora.yaml, each with a reason:
#
#   1. Rank 16 -> 32. The first run's validation loss was still falling when it
#      stopped, which says the adapter ran out of schedule, not out of capacity
#      to use.
#   2. q,v -> q,k,v,out_proj. Adapting only the query and value projections is
#      the conservative default for small corpora. With 2h36m of audio there is
#      room for the full attention block.
#   3. 6 -> 12 epochs, same reason as 1.
#
# SpecAugment is on because the corpus is small and single-domain: masking time
# and frequency bands is the cheapest regularisation available for speech, and
# it costs nothing at inference.

base_model: openai/whisper-small
language: hi
task: transcribe

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "out_proj"]

training:
  # Slightly lower than the first run: more trainable parameters at the same
  # rate tends to overshoot early and then spend epochs recovering.
  learning_rate: 8.0e-5
  epochs: 12
  per_device_batch_size: 8
  gradient_accumulation_steps: 2
  warmup_ratio: 0.1
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  gradient_checkpointing: true
  validation_fraction: 0.05
  seed: 42
  eval_steps: 120
  save_steps: 120
  logging_steps: 20
  early_stopping_patience: 4
  spec_augment: true
  mask_time_prob: 0.05
  mask_feature_prob: 0.05
