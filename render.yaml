# Render static site. The reader is prebuilt - chapters, metrics and audio are
# generated by the pipeline and committed - so there is nothing to build here and
# no server to keep warm.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.

services:
  - type: web
    name: vocalia
    runtime: static
    staticPublishPath: ./web
    buildCommand: ""
    pullRequestPreviewsEnabled: false
    headers:
      # Content is versioned by commit; a short cache keeps a redeploy visible
      # without refetching audio on every page view.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
      - path: /data/*
        name: Cache-Control
        value: public, max-age=300
