# Render static site.
#
# rootDir matters more than it looks. With the service rooted at the repository
# root, Render finds requirements.txt, decides this is a Python project, selects
# the newest Python it supports and tries to install torch to serve three static
# files. That fails - there is no torch 2.5.1 wheel for Python 3.14, which is the
# same version trap the local setup documents avoiding.
#
# Rooting the service at web/ means the build never sees requirements.txt. The
# reader is prebuilt and committed, so there is nothing to install and nothing
# to build.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.

services:
  - type: web
    name: homespun-awadhi
    runtime: static
    rootDir: web
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
