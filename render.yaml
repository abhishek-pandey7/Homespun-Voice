# Render static site. The reader is prebuilt - chapters, metrics and audio are
# generated by the pipeline and committed - so there is nothing to build and no
# server to keep warm.
#
# Deploy: Render dashboard -> New -> Blueprint -> point at this repository.
#
# buildCommand is a no-op echo rather than an empty string: Render rejects the
# blueprint when the key is present but blank.

services:
  - type: web
    name: homespun
    runtime: static
    buildCommand: echo "nothing to build"
    staticPublishPath: ./web
    pullRequestPreviewsEnabled: false
